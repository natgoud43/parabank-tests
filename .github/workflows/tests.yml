name: Parabank test suite

on:
  push:                 # every push wakes the robot
  workflow_dispatch:    # adds a "Run workflow" button on GitHub

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API tests
        run: python -m pytest -m api --junitxml=results-api.xml  

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6         # copy your repo onto the machine
      - uses: actions/setup-python@v6     # install Python
        with:
          python-version: "3.13"

      - name: Install dependencies
        run:  pip install -r requirements.txt
      
      - name: Save API results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results 
          path: results-api.xml
        
      - name: Run UI tests
        run: >-
          python -m pytest -m ui --browser-channel chrome
          --screenshot only-on-failure --tracing retain-on-failure
          --html=report.html --self-contained-html
          --junitxml=results.xml

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results.xml
            report.html
            test-results/
